<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" class="zynith-logo-svg">
  <defs>
    <linearGradient id="ztGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#0057FF" />
    </linearGradient>
    <linearGradient id="ztGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="ztShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#007AFF" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Modern Geometric Z Symbol Mark -->
  <g transform="translate(4, 8)" filter="url(#ztShadow)">
    <!-- Tech Poly Z -->
    <path d="M 6 4 L 42 4 L 42 12 L 18 36 L 42 36 L 42 44 L 6 44 L 6 36 L 30 12 L 6 12 Z" fill="url(#ztGrad)" />
    <!-- Dynamic accent prism nodes -->
    <polygon points="6,4 20,4 12,12 6,12" fill="#38BDF8" opacity="0.9" />
    <polygon points="28,36 42,36 42,44 36,44" fill="#00D2FF" />
    <circle cx="36" cy="8" r="3" fill="#00FFA3" />
    <circle cx="12" cy="40" r="3" fill="#00FFA3" />
    <path d="M 12 40 L 36 8" stroke="url(#ztGlow)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.75" />
  </g>

  <!-- Typography: ZYNITH TECHNOLOGY -->
  <g transform="translate(62, 0)">
    <text x="0" y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="23" letter-spacing="0.08em" fill="#FFFFFF">
      ZYNITH
    </text>
    <text x="0" y="47" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="9.5" letter-spacing="0.32em" fill="#38BDF8">
      TECHNOLOGY
    </text>
  </g>
</svg>
